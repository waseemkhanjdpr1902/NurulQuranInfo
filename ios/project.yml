name: NurulQuran
options:
  bundleIdPrefix: info.nurulquran
  deploymentTarget:
    iOS: '16.0'
targets:
  NurulQuran:
    type: application
    platform: iOS
    sources: [NurulQuran]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.nurulquran.ios
        PRODUCT_NAME: NurulQuran
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NurulQuran
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
